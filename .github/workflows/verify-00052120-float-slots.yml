name: Verify 0x00052120 guest float stack repair
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_0005/0x00052120.c'
      - 'scripts/verify_00052120_guest_float_slots.py'
      - 'scripts/verify_00052120_resolved_vtable_targets.py'
      - 'src/main_unclassified/band_0005/0x00052c90.c'
      - 'src/main_unclassified/band_0023/0x00236670.c'
      - 'tests/test_00052120_guest_frame.c'
      - '.github/workflows/verify-00052120-float-slots.yml'
      - 'include/bf_ghidra_types.h'
  workflow_dispatch:
jobs:
  guest-float-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Verify two parent calls, guest output aliases and GNU/MSVC x86 ABI
        run: python3 scripts/verify_00052120_guest_float_slots.py --root .
      - name: Check resolved original vtable slot and both helper call paths (source-only)
        run: python3 scripts/verify_00052120_resolved_vtable_targets.py --root .
# The copyrighted original XBE must never be stored in GitHub Actions.
# Run the same verifier locally with --xbe against the authenticated image.
