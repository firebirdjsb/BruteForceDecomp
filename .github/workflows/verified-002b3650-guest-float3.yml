name: Verified 0x002B3650 guest float3 stack and vtable outputs
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_002b/0x002b3650.c'
      - 'scripts/verify_002b3650_guest_float3.py'
      - '.github/workflows/verified-002b3650-guest-float3.yml'
      - 'include/bf_ghidra_types.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original stack float3 and isolated host C11 syntax
        run: python3 scripts/verify_002b3650_guest_float3.py --root .
