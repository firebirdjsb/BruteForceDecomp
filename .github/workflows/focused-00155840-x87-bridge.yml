name: Focused 0x00155840 guest x87 call bridge
# Legacy C11-triggered workflow: manual only until C++ repairs are validated.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  guest-x87-bridge:
    name: Guest copy, x87 ordering and bounded rounding/exception checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Clang C11 reference tests (unoptimized and optimized)
        shell: bash
        run: |
          set -euo pipefail
          for opt in 0 2; do
            clang -std=c11 -O"$opt" -Wall -Wextra -Werror -pedantic \
              -ffp-contract=off -Iinclude \
              tests/test_00155840_x87_call_bridge.c \
              -o "$RUNNER_TEMP/test_00155840_x87_bridge_$opt"
            "$RUNNER_TEMP/test_00155840_x87_bridge_$opt"
          done
      - name: Verify original guest upload copies and aliases
        shell: bash
        run: |
          set -euo pipefail
          for opt in 0 2; do
            clang -std=c11 -O"$opt" -Wall -Wextra -Werror -pedantic \
              -Iinclude tests/test_00155840_upload_bridge.c \
              -o "$RUNNER_TEMP/test_00155840_upload_$opt"
            "$RUNNER_TEMP/test_00155840_upload_$opt"
          done
      - name: Host x87 long-double rounding and exceptional references
        shell: bash
        run: |
          set -euo pipefail
          for opt in 0 2; do
            clang -std=c11 -O"$opt" -Wall -Wextra -Werror -pedantic \
              -frounding-math -ffp-contract=off -Iinclude \
              tests/test_00155840_x87_rounding.c -lm \
              -o "$RUNNER_TEMP/test_00155840_rounding_$opt"
            "$RUNNER_TEMP/test_00155840_rounding_$opt"
          done
      - name: Constructor-backed method and x87 frame increment
        shell: bash
        run: |
          set -euo pipefail
          for opt in 0 2; do
            clang -std=c11 -O"$opt" -Wall -Wextra -Werror -pedantic \
              -ffp-contract=off -Iinclude \
              tests/test_00155840_concrete_frame.c \
              -o "$RUNNER_TEMP/test_00155840_concrete_$opt"
            "$RUNNER_TEMP/test_00155840_concrete_$opt"
          done
      - name: Original instruction-backed 00155BDD scale/add sequence
        shell: bash
        run: |
          set -euo pipefail
          for opt in 0 2; do
            clang -std=c11 -O"$opt" -Wall -Wextra -Werror -pedantic \
              -ffp-contract=off -Iinclude \
              tests/test_00155840_x87_scale.c \
              -o "$RUNNER_TEMP/test_00155840_scale_$opt"
            "$RUNNER_TEMP/test_00155840_scale_$opt"
          done
      - name: Verify original scalar RSQRTSS and SQRTSS stores
        shell: bash
        run: |
          set -euo pipefail
          for opt in 0 2; do
            clang -std=c11 -O"$opt" -Wall -Wextra -Werror -pedantic-errors \
              -ffp-contract=off -Iinclude \
              tests/test_00155840_scalar_sse.c \
              -o "$RUNNER_TEMP/test_00155840_sse_$opt"
            "$RUNNER_TEMP/test_00155840_sse_$opt"
          done
      - name: State verification scope
        run: |
          echo "Source helper replays observed 0x000621C0 guest memory and x87 operations."
          echo "Finite dyadic reference tests and access ordering do not prove full x87 exception/control/status parity."
          echo "Original FUN_00155840 caller, virtual-call target and linked native execution remain ABI_UNVERIFIED."
