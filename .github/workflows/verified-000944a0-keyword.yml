name: Verify 0x000944a0 incoming guest key word
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_0009/0x000944a0.c'
      - 'scripts/verify_000944a0_guest_key_word.py'
      - '.github/workflows/verified-000944a0-keyword.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared guest key word and isolated Clang C11
        run: python3 scripts/verify_000944a0_guest_key_word.py --root .
      - name: Evidence boundary
        run: echo "Original XBE checked locally, not committed; guest ABI/native runtime unverified."
