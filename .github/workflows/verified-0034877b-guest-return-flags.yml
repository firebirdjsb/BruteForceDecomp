name: Verify 0x0034877B guest return flags
on:
  push:
    branches: [main]
    paths:
      - 'src/platform/network_xnet/0x0034877b.c'
      - 'scripts/verify_0034877b_guest_return_flags.py'
      - 'tests/test_0034877b_guest_flags.c'
      - 'include/bf_ghidra_types.h'
      - '.github/workflows/verified-0034877b-guest-return-flags.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-high-byte-return:
    name: Source, mutation and host C11 tests (original XBE not in CI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify original high-byte flag contract (source-only CI)
        run: python3 scripts/verify_0034877b_guest_return_flags.py --root .
