name: Verified XBE stack-slot and exception-address and atexit C11 checks
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_0013/0x00136410.c'
      - 'src/main_unclassified/band_0013/0x001364e0.c'
      - 'src/main_unclassified/band_0013/0x001365b0.c'
      - 'src/main_unclassified/band_0013/0x00136680.c'
      - 'src/main_unclassified/band_002f/0x002f4c4a.c'
      - 'src/main_unclassified/band_002e/0x002ea4bf.c'
      - 'tools/verify_x86_stack_slot_and_exception_address.py'
      - 'src/main_unclassified/band_0008/0x0008e590.c'
      - 'src/main_unclassified/band_0010/0x00102300.c'
      - 'scripts/verify_00102300_stack_argument.py'
      - 'src/main_unclassified/band_000f/0x000f0480.c'
      - 'scripts/verify_000f0480_guest_output_word.py'
      - 'src/main_unclassified/band_0028/0x002825e0.c'
      - 'scripts/verify_002825e0_interface_stack.py'
      - 'tools/verify_stack_record_8e590.py'
      - '.github/workflows/verified-stack-slot-words.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify six original-entry source invariants and Clang C11 syntax
        run: python3 tools/verify_x86_stack_slot_and_exception_address.py --root .
      - name: Verify 0x0008e590 stack record and focused C11 syntax (without XBE)
        run: python3 tools/verify_stack_record_8e590.py --root .
      - name: Verify 0x00102300 local byte offset and focused C11 (source-only CI)
        run: python3 scripts/verify_00102300_stack_argument.py --root .
      - name: Verify 0x000F0480 shared guest output DWORD and focused Clang C11
        run: python3 scripts/verify_000f0480_guest_output_word.py --root .
      - name: Verify 0x002825E0 interface output and GUID scratch aliases (source-only CI)
        run: python3 scripts/verify_002825e0_interface_stack.py --root .
      - name: Evidence limitation
        run: echo 'Retail XBE instruction fingerprints checked locally; not distributed in repository. Caller-frame ABI, guest exception semantics and native runtime remain unverified.'
