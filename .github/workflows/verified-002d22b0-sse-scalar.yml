name: Verified 0x002D22B0 SSE scalar lifetime
# Legacy C11-triggered workflow: manual only until C++ repairs are validated.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-sse-scalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check original SSE scalar source and isolated Clang C11
        run: python3 scripts/verify_002d22b0_sse_scalar_lifetime.py --root .
