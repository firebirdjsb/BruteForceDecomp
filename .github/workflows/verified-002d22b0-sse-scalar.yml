name: Verified 0x002D22B0 SSE scalar lifetime
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_002d/0x002d22b0.c'
      - 'scripts/verify_002d22b0_sse_scalar_lifetime.py'
      - '.github/workflows/verified-002d22b0-sse-scalar.yml'
      - 'include/bf_ghidra_types.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-sse-scalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check original SSE scalar source and isolated Clang C11
        run: python3 scripts/verify_002d22b0_sse_scalar_lifetime.py --root .
