name: Verify 0x002D87A0 original x87 and SSE scalar results
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_002d/0x002d87a0.c'
      - 'scripts/verify_002d87a0_x87_rsqrt_float32.py'
      - '.github/workflows/verified-002d87a0-rsqrt-float32.yml'
      - 'include/bf_ghidra_types.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original reciprocal and RSQRTSS isolated Clang C11
        run: python3 scripts/verify_002d87a0_x87_rsqrt_float32.py --root .
