name: Verified original XBE guest-address instruction checks

# Legacy C11-triggered workflow: manual only until C++ repairs are validated.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-guest-immediate-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Confirm original source identities and 29 verified 32-bit immediates
        run: python3 tools/verify_guest_code_addresses.py --root .
      - name: Explicit evidence boundary
        run: |
          echo 'Original retail XBE SHA256 and 29 instruction fingerprints were verified on the user-supplied executable; it is not distributed in Git.'
          echo 'Source-only checks do NOT provide native function pointer relocation, complete ABI reconstruction, or 1:1 behavior.'
