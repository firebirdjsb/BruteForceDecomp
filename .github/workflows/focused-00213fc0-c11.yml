name: Verify 0x00213FC0 C11 and original opcode contracts
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_0021/0x00213fc0.c'
      - 'scripts/verify_00213fc0_partial_store.py'
      - '.github/workflows/focused-00213fc0-c11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-c11:
    name: Original DWORD float and partial-byte store contracts
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Source contracts and Clang isolated C11
        run: python3 scripts/verify_00213fc0_partial_store.py --root . --clang
      - name: Scope
        run: |
          echo "Clang syntax and source instruction contracts only; guest ABI, SSE, and linked runtime are unverified."
