name: Full C11 draft syntax inventory
on:
  push:
    paths:
      - 'tools/sweep_c11.py'
      # Focused evidence-based fixes also refresh the cumulative failure total.
      - 'src/0x000213e0.c'
      - 'src/0x00025870.c'
      - 'src/0x00026060.c'
      - 'src/0x0002bf60.c'
      - 'src/0x00024c00.c'
      # Reviewed mapped-label repairs; grouped failure inventory stays current.
      - 'src/0x00156240.c'
      - 'src/0x0016d310.c'
      - 'src/0x0017c620.c'
      - 'src/0x0017d8a0.c'
      - '.github/workflows/full-c11-inventory.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/sweep_c11.py'
      - '.github/workflows/full-c11-inventory.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Audit only — failures expected, not a build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Identify exact checked out SHA
        run: |
          echo "AUDITED_COMMIT=${GITHUB_SHA}"
          clang --version | head -n 1
      - name: Audit all 13,694 discovered function source files
        run: python3 tools/sweep_c11.py --root . --out c11_sweep_results --jobs 8
      - name: Upload audit and per-address error diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-c11-inventory
          path: c11_sweep_results/
          if-no-files-found: warn
      - name: Explicitly report the pass/fail counts
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('c11_sweep_results/c11_sweep_report.json'))
          print('Host Clang C11 syntax pass:', r['counts'].get('pass', 0))
          print('Host Clang C11 syntax fail:', r['counts'].get('fail', 0))
          print('Source provenance mismatches:', r['body_hash_mismatches'])
          print('This workflow is an inventory, not a validated reconstruction.')
          PY
