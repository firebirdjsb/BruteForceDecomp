name: Full C11 draft syntax inventory
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'metadata/**'
      - 'tools/sweep_c11.py'
      - 'tools/audit_entrypoint_symbols.py'
      - 'tools/body_hash_labels.py'
      - 'tools/test_body_hash_labels.py'
      - 'tools/test_x86_word_lanes.c'
      - 'tools/recheck_c11_provenance.py'
      - 'tools/classify_c11_functions.py'
      - '.github/workflows/full-c11-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit only — failures expected, not a build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Identify exact checked out SHA
        run: |
          echo "AUDITED_COMMIT=${GITHUB_SHA}"
          clang --version | head -n 1
      - name: Verify all accepted provenance label formats
        run: python3 tools/test_body_hash_labels.py
      - name: Validate Ghidra x86 DWORD subpiece normalization
        run: |
          clang -std=c11 -Wall -Wextra -Werror -I include tools/test_x86_word_lanes.c -o /tmp/bf_x86_word_lanes_test
          /tmp/bf_x86_word_lanes_test
      - name: Recheck original body digests against canonical inventory
        run: python3 tools/recheck_c11_provenance.py --root .
      - name: Audit all 13,694 discovered function source files
        run: python3 tools/sweep_c11.py --root . --out c11_sweep_results --jobs 8
      - name: Inventory candidate C entrypoint identities without asserting linkage
        run: python3 tools/audit_entrypoint_symbols.py --root . --out c11_sweep_results/entry_symbol_audit.csv
      - name: Upload audit and per-address error diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-c11-inventory
          path: c11_sweep_results/
          if-no-files-found: warn
      - name: Explicitly report the pass/fail counts
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('c11_sweep_results/c11_sweep_report.json'))
          print('Host Clang C11 syntax pass:', r['counts'].get('pass', 0))
          print('Host Clang C11 syntax fail:', r['counts'].get('fail', 0))
          print('Source provenance mismatches:', r['body_hash_mismatches'])
          print('Source files without an embedded original x86 body hash:', r['body_hash_missing'])
          print('This workflow is an inventory, not a validated reconstruction.')
          if r['source_tree_entries'] != 13694:
              raise SystemExit('INTEGRITY FAILURE: unexpected number of source files')
          if r['body_hash_mismatches']:
              raise SystemExit('INTEGRITY FAILURE: one or more original x86 body hash labels differ from the inventory')
          if r['body_hash_missing']:
              raise SystemExit('INTEGRITY FAILURE: one or more sources lack embedded original x86 body hash provenance')
          PY
