name: Full C11 draft syntax inventory
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'metadata/**'
      - 'tools/sweep_c11.py'
      - 'tools/triage_c11_failures.py'
      - 'tools/test_triage_c11_failures.py'
      - 'scripts/group_guest_stack_failures.py'
      - 'scripts/test_group_guest_stack_failures.py'
      - 'tools/audit_xbe_first_100.py'
      - 'tools/audit_xbe_kernel_imports.py'
      - 'tools/test_xbe_kernel_imports.py'
      - 'tools/audit_entrypoint_symbols.py'
      - 'tools/test_audit_entrypoint_symbols.py'
      - 'tools/body_hash_labels.py'
      - 'tools/test_body_hash_labels.py'
      - 'tools/test_x86_word_lanes.c'
      - 'tools/test_x86_sso28.c'
      - 'tools/test_x86_normalize3.c'
      - 'tests/x86_normalize3_reference.S'
      - 'tools/recheck_c11_provenance.py'
      - 'tools/classify_c11_functions.py'
      - 'tools/source_layout.py'
      - 'tools/test_source_layout.py'
      - 'tools/test_check_sources.py'
      - 'tools/check_repository_safety.py'
      - 'tools/test_repository_safety.py'
      - 'tools/test_progress.py'
      - 'tools/test_guest_stack_repair.py'
      - 'tools/verify_incoming_stack_words.py'
      - 'tests/guest_frame_contract.c'
      - 'tools/update_progress.py'
      - 'scripts/check_sources.py'
      - 'scripts/verify_low_guest_address_reads.py'
      - 'scripts/verify_guest32_fallback_and_dpc_immediates.py'
      - 'scripts/verify_0010bb70_low_byte.py'
      - 'scripts/verify_0010_guest_word_clears.py'
      - 'scripts/verify_0013b050_record_lowbyte.py'
      - 'scripts/verify_0008a460_guest_outword.py'
      - 'scripts/verify_00090630_guest_param_word.py'
      - 'scripts/verify_00076870_guest_second_arg_word.py'
      - 'scripts/verify_0007b4d0_format_buffer.py'
      - 'scripts/verify_0024a600_guest_element.py'
      - 'scripts/verify_0007b8f0_0007bef0_inline_storage.py'
      - 'scripts/verify_0004f2e0_local_slots.py'
      - 'scripts/verify_three_guest_dword_addresses.py'
      - 'scripts/verify_000b2660_guest_esi_word.py'
      - 'scripts/verify_two_node_copy_incoming_words.py'
      - 'scripts/verify_000a1990_guest_outslot.py'
      - 'scripts/verify_000d29b0_guest_outword.py'
      - 'scripts/verify_0002b8b0_guest_byte_and_x87.py'
      - 'scripts/verify_000d0c20_guest_record.py'
      - 'scripts/verify_000da880_guest_second_word.py'
      - 'scripts/verify_000f24f0_000f2c60.py'
      - 'scripts/verify_000f0640_saved_ecx_word.py'
      - '.github/workflows/full-c11-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit only — failures expected, not a build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Identify exact checked out SHA
        run: |
          echo "AUDITED_COMMIT=${GITHUB_SHA}"
          clang --version | head -n 1
      - name: Verify all accepted provenance label formats
        run: python3 tools/test_body_hash_labels.py
      - name: Verify entry-symbol audit accepts relative repository roots
        run: python3 tools/test_audit_entrypoint_symbols.py
      - name: Verify C-only lexical hygiene and provenance
        run: |
          python3 tools/test_check_sources.py
          python3 scripts/check_sources.py
      - name: Verify no restricted tracked files or recognizable credentials
        run: |
          python3 tools/test_repository_safety.py
          python3 tools/check_repository_safety.py --root .
          python3 tools/test_progress.py
      - name: Validate Ghidra x86 DWORD subpiece normalization
        run: |
          clang -std=c11 -Wall -Wextra -Werror -I include tools/test_x86_word_lanes.c -o /tmp/bf_x86_word_lanes_test
          /tmp/bf_x86_word_lanes_test
      - name: Verify x86 float word transfers
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic-errors -I include tools/test_x86_float_lanes.c -o /tmp/bf_x86_float_lane_test
          /tmp/bf_x86_float_lane_test
      - name: Verify observed 28-byte string storage writes (no full-function ABI claim)
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic-errors -I include tools/test_x86_sso28.c -o /tmp/bf_x86_sso28_test
          /tmp/bf_x86_sso28_test
          clang -std=c11 -Wall -Wextra -Werror -pedantic-errors -O2 -DNDEBUG -I include tools/test_x86_sso28.c -o /tmp/bf_x86_sso28_release_test
          /tmp/bf_x86_sso28_release_test
      - name: Compare shared SSE storage operation with host assembly reference
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic-errors -O0 -I include tools/test_x86_normalize3.c tests/x86_normalize3_reference.S -o /tmp/bf_normalize3_test
          /tmp/bf_normalize3_test
          clang -std=c11 -Wall -Wextra -Werror -pedantic-errors -O2 -DNDEBUG -I include tools/test_x86_normalize3.c tests/x86_normalize3_reference.S -o /tmp/bf_normalize3_release_test
          /tmp/bf_normalize3_release_test
      - name: Verify repaired guest-stack C11 drafts and model (no original XBE in CI)
        run: |
          python3 tools/test_guest_stack_repair.py
          clang -std=c11 -Wall -Wextra -Werror -pedantic tests/guest_frame_contract.c -o /tmp/bf_guest_frame_test
          /tmp/bf_guest_frame_test
          clang -std=c11 -Wall -Wextra -Werror -pedantic -O2 -DNDEBUG tests/guest_frame_contract.c -o /tmp/bf_guest_frame_test_release
          /tmp/bf_guest_frame_test_release
      - name: Verify synthetic Xbox kernel thunk parsing
        run: python3 tools/test_xbe_kernel_imports.py
      - name: Verify sorted source layout and exact function identities
        run: python3 tools/test_source_layout.py
      - name: Refresh local evidence-limited function groups for relocated sources
        run: python3 tools/classify_c11_functions.py
      - name: Recheck original body digests against canonical inventory
        run: python3 tools/recheck_c11_provenance.py --root .
      - name: Run 100 function-by-function x86 provenance and host C11 syntax passes
        run: python3 tools/audit_xbe_first_100.py --root . --out c11_sweep_results/first_100_function_passes.json
      - name: Verify five low-address guest memory C11 repairs (syntax only without XBE)
        run: python3 scripts/verify_low_guest_address_reads.py --root .
      - name: Verify guest null-base read and DPC code immediate (syntax only without XBE)
        run: python3 scripts/verify_guest32_fallback_and_dpc_immediates.py --root .
      - name: Verify observed guest stack lane and DWORD out-argument repairs (source-only CI)
        run: |
          python3 scripts/verify_0010bb70_low_byte.py --root .
          python3 scripts/verify_0010_guest_word_clears.py --root .
          python3 scripts/verify_0013b050_record_lowbyte.py --root .
          python3 scripts/verify_0008a460_guest_outword.py --root .
          python3 scripts/verify_00090630_guest_param_word.py --root .
      - name: Verify three original incoming stack-word address forwards (source-only CI)
        run: python3 tools/verify_incoming_stack_words.py --root .
      - name: Verify 0x00076870 original incoming DWORD output slot (source-only CI)
        run: python3 scripts/verify_00076870_guest_second_arg_word.py --root .
      - name: Verify shared 0x0007b4d0 formatter stack buffer (source-only CI)
        run: python3 scripts/verify_0007b4d0_format_buffer.py --root .
      - name: Verify incoming 0x0024a600 byte-element word (source-only CI)
        run: python3 scripts/verify_0024a600_guest_element.py --root .
      - name: Verify two inline-string stack pointers (source-only CI; original XBE stays local)
        run: python3 scripts/verify_0007b8f0_0007bef0_inline_storage.py --root .
      - name: Verify distinct 0x0004f2e0 stack slots (source and focused Clang; no XBE in CI)
        run: python3 scripts/verify_0004f2e0_local_slots.py --root .
      - name: Verify three guest DWORD stack-address repairs (source and Clang; no XBE in CI)
        run: python3 scripts/verify_three_guest_dword_addresses.py --root .
      - name: Verify guest ESI stack DWORD passed to 0x000e0860 (source and Clang)
        run: python3 scripts/verify_000b2660_guest_esi_word.py --root .
      - name: Verify two node-copy incoming DWORD slots (source and Clang; XBE stays local)
        run: python3 scripts/verify_two_node_copy_incoming_words.py --root .
      - name: Verify 0x000a1990 guest out-slot reference ownership (source and Clang; no XBE in CI)
        run: python3 scripts/verify_000a1990_guest_outslot.py --root .
      - name: Verify 0x0002b8b0 byte-pointer and x87 slot source (private XBE not in CI)
        run: python3 scripts/verify_0002b8b0_guest_byte_and_x87.py --root .
      - name: Verify 0x000d29b0 guest first-stack-word out-slot (source and Clang; no XBE in CI)
        run: python3 scripts/verify_000d29b0_guest_outword.py --root .
      - name: Verify 0x000d0c20 guest incoming record source and Clang (no XBE in CI)
        run: python3 scripts/verify_000d0c20_guest_record.py --root .
      - name: Verify 0x000f0640 saved guest ECX word (source-only CI, no private XBE)
        run: python3 scripts/verify_000f0640_saved_ecx_word.py --root .
      - name: Verify 0x000da880 reused second incoming DWORD (source and Clang; XBE stays local)
        run: python3 scripts/verify_000da880_guest_second_word.py --root .
      - name: Verify 0x000f24f0 and 0x000f2c60 guest stack frames (source and Clang; XBE stays local)
        run: python3 scripts/verify_000f24f0_000f2c60.py --root .
      - name: Audit all 13,694 discovered function source files
        run: python3 tools/sweep_c11.py --root . --out c11_sweep_results --jobs 8
      - name: Validate and categorize exact audit failures without XBE assumptions
        run: |
          python3 tools/test_triage_c11_failures.py
          python3 tools/triage_c11_failures.py \
            --report c11_sweep_results/c11_sweep_report.json \
            --out-json c11_sweep_results/failure_triage.json \
            --out-csv c11_sweep_results/failure_triage.csv
      - name: Verify and group unresolved guest-stack first errors (no XBE inference)
        run: |
          python3 scripts/test_group_guest_stack_failures.py
          python3 scripts/group_guest_stack_failures.py \
            c11_sweep_results/failure_triage.csv \
            --output c11_sweep_results/guest_stack_offsets.csv
      - name: Inventory candidate C entrypoint identities without asserting linkage
        run: python3 tools/audit_entrypoint_symbols.py --root . --out c11_sweep_results/entry_symbol_audit.csv
      - name: Upload audit and per-address error diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-c11-inventory
          path: c11_sweep_results/
          if-no-files-found: warn
      - name: Explicitly report the pass/fail counts
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('c11_sweep_results/c11_sweep_report.json'))
          print('Host Clang C11 syntax pass:', r['counts'].get('pass', 0))
          print('Host Clang C11 syntax fail:', r['counts'].get('fail', 0))
          print('Source provenance mismatches:', r['body_hash_mismatches'])
          print('Source files without an embedded original x86 body hash:', r['body_hash_missing'])
          print('This workflow is an inventory, not a validated reconstruction.')
          if r['source_tree_entries'] != 13694:
              raise SystemExit('INTEGRITY FAILURE: unexpected number of source files')
          if r['body_hash_mismatches']:
              raise SystemExit('INTEGRITY FAILURE: one or more original x86 body hash labels differ from the inventory')
          if r['body_hash_missing']:
              raise SystemExit('INTEGRITY FAILURE: one or more sources lack embedded original x86 body hash provenance')
          PY
