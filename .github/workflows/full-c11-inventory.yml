        run: python3 scripts/verify_00084f50_guest_local_aliases.py --root .
      - name: Verify original 0x001FEB60 iterator register and output contract (source-only CI)
        run: python3 scripts/verify_001feb60_iterator_contract.py --root .
      - name: Verify 0x00042280 returned EAX flag clears (source-only CI)
