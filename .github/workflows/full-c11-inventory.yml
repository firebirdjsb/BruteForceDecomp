jobs:
  audit:
    name: Audit only — failures expected, not a build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Identify exact checked out SHA
        run: |
          echo "AUDITED_COMMIT=${GITHUB_SHA}"
          clang --version | head -n 1
      - name: Verify all accepted provenance label formats
        run: python3 tools/test_body_hash_labels.py
      - name: Verify entry-symbol audit accepts relative repository roots
        run: python3 tools/test_audit_entrypoint_symbols.py
      - name: Verify C-only lexical hygiene and provenance
        run: |
          python3 tools/test_check_sources.py
          python3 scripts/check_sources.py
      - name: Verify no restricted tracked files or recognizable credentials
        run: |
          python3 tools/test_repository_safety.py
          python3 tools/check_repository_safety.py --root .
          python3 tools/test_progress.py
          python3 tools/test_check_published_progress.py
          python3 tools/check_published_progress.py --root .
      - name: Verify full-audit push triggers cover every local test input
        run: python3 tools/test_full_audit_path_filters.py
      - name: Validate Ghidra x86 DWORD subpiece normalization
        run: |
          clang -std=c11 -Wall -Wextra -Werror -I include tools/test_x86_word_lanes.c -o /tmp/bf_x86_word_lanes_test
          /tmp/bf_x86_word_lanes_test
      - name: Verify x86 float word transfers
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic-errors -I include tools/test_x86_float_lanes.c -o /tmp/bf_x86_float_lane_test
          /tmp/bf_x86_float_lane_test
      - name: Verify observed 28-byte string storage writes (no full-function ABI claim)
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic-errors -I include tools/test_x86_sso28.c -o /tmp/bf_x86_sso28_test
          /tmp/bf_x86_sso28_test
          clang -std=c11 -Wall -Wextra -Werror -pedantic-errors -O2 -DNDEBUG -I include tools/test_x86_sso28.c -o /tmp/bf_x86_sso28_release_test
          /tmp/bf_x86_sso28_release_test
      - name: Compare shared SSE storage operation with host assembly reference
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic-errors -O0 -I include tools/test_x86_normalize3.c tests/x86_normalize3_reference.S -o /tmp/bf_normalize3_test
          /tmp/bf_normalize3_test
          clang -std=c11 -Wall -Wextra -Werror -pedantic-errors -O2 -DNDEBUG -I include tools/test_x86_normalize3.c tests/x86_normalize3_reference.S -o /tmp/bf_normalize3_release_test
          /tmp/bf_normalize3_release_test
      - name: Verify 0x1304b0 guest second output word and isolated C11
        run: python3 scripts/verify_001304b0_guest_second_word.py
      - name: Verify 0x1252b0 vcall guest output slot and isolated C11
        run: python3 scripts/verify_001252b0_guest_vcall_output.py
      - name: Compile repaired 0x7c0b0 and 0x7fba0 guest-stack drafts
        run: python3 scripts/verify_0007c0b0_0007fba0_guest_stack.py
      - name: Verify repaired guest-stack C11 drafts and model (no original XBE in CI)
        run: |
          python3 tools/test_guest_stack_repair.py
          clang -std=c11 -Wall -Wextra -Werror -pedantic tests/guest_frame_contract.c -o /tmp/bf_guest_frame_test
          /tmp/bf_guest_frame_test
          clang -std=c11 -Wall -Wextra -Werror -pedantic -O2 -DNDEBUG tests/guest_frame_contract.c -o /tmp/bf_guest_frame_test_release
          /tmp/bf_guest_frame_test_release
      - name: Verify 0x002EB90C Xbox longjmp guest record and Clang C11 (source-only CI)
        run: python3 scripts/verify_002eb90c_guest_jump_context.py --root .
      - name: Verify 0x000A7270 texture interface output slot and Clang C11
        run: python3 scripts/verify_000a7270_texture_output.py --root .
      - name: Verify 0x000F7230 adjacent x86 guest output slots and Clang C11
