        run: python3 scripts/verify_xbox_crt_cursor_contracts.py --root .
      - name: Verify Xbox CRT guest callback slots and code patch (XBE stays local)
        run: python3 scripts/verify_xbox_crt_callback_and_patch.py --root .
      - name: Verify recovered recursive AL and EAX guest return values (XBE stays local)
        run: python3 scripts/verify_00236xxx_recursive_returns.py --root .
      - name: Verify 0x0014D960 two-DWORD out-buffer EAX return (XBE stays local)
        run: python3 scripts/verify_0014d960_out_buffer_return.py --root .
      - name: Verify 0x000AEC10 original x87 outgoing float word (XBE stays local)
        run: python3 scripts/verify_000aec10_x87_guest_word.py --root .
      - name: Verify guest format-string addresses and byte-width header stores (XBE stays local)
        run: python3 scripts/verify_257b50_aa600_guest_bytes.py --root .
      - name: Verify 16-byte guest lanes and parser format immediates (XBE stays local)
        run: python3 scripts/verify_guest_16byte_lanes_and_formats.py --root .
      - name: Verify section-mapped Xbox HRTF callbacks and hardware import byte (XBE stays local)
        run: python3 scripts/verify_section_mapped_audio_and_hardware.py --root .
      - name: Verify D3D 0x00377A50 three callback DWORDs and EBP status (XBE stays local)
        run: python3 scripts/verify_00377a50_d3d_callback_words.py --root .
      - name: Verify Xbox D3D original guest MMIO offsets (XBE stays local)
        run: python3 scripts/verify_d3d_374a49_mmio.py --root .
      - name: Verify Bink 0x0035A960 guest wait-handle DWORD order (XBE stays local)
        run: python3 scripts/verify_0035a960_bink_wait_handles.py --root .
      - name: Verify original Bink32 MMX byte/word lane instructions (XBE stays local)
        run: python3 scripts/verify_bink32_mmx_byte_lanes.py --root .
      - name: Test reconstructed MMX byte/word lanes in strict host C11
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic-errors -I include tools/test_x86_mmx_byte_lanes.c -o /tmp/bf_mmx_byte_lanes_test
          /tmp/bf_mmx_byte_lanes_test
      - name: Verify 0x000B0AD0 scalar SSE instruction-backed C11 repair (source-only CI)
        run: python3 scripts/verify_000b0ad0_scalar_sse.py --root .
      - name: Verify 0x0014B290 original DWORD bits and RCPSS (source and Clang; XBE stays local)
        run: python3 scripts/verify_0014b290_rcpss_bits.py --root .
      - name: Verify two original packed SSE color conversions (source and Clang; XBE stays local)
        run: python3 scripts/verify_000a4d80_000a50b0_sse.py --root .
      - name: Audit all 13,694 discovered function source files
        run: python3 tools/sweep_c11.py --root . --out c11_sweep_results --jobs 8
      - name: Validate and categorize exact audit failures without XBE assumptions
        run: |
          python3 tools/test_triage_c11_failures.py
          python3 tools/triage_c11_failures.py \
            --report c11_sweep_results/c11_sweep_report.json \
            --out-json c11_sweep_results/failure_triage.json \
            --out-csv c11_sweep_results/failure_triage.csv
      - name: Verify and group unresolved guest-stack first errors (no XBE inference)
        run: |
          python3 scripts/test_group_guest_stack_failures.py
          python3 scripts/group_guest_stack_failures.py \
            c11_sweep_results/failure_triage.csv \
            --output c11_sweep_results/guest_stack_offsets.csv
