name: Verified 0x00166C60 original x87 global float words
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_0016/0x00166c60.c'
      - 'scripts/verify_00166c60_x87_globals.py'
      - '.github/workflows/verified-00166c60-x87-globals.yml'
      - 'include/bf_ghidra_types.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-x87-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 16 original x87 source instructions and isolated C11 syntax
        run: python3 scripts/verify_00166c60_x87_globals.py --root .
