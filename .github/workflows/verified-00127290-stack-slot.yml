name: Verified 0x00127290 incoming guest stack alias
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_0012/0x00127290.c'
      - 'scripts/verify_00127290_incoming_stack_alias.py'
      - '.github/workflows/verified-00127290-stack-slot.yml'
      - 'include/bf_ghidra_types.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stack-slot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original first argument guest stack slot and isolated C11
        run: python3 scripts/verify_00127290_incoming_stack_alias.py --root .
