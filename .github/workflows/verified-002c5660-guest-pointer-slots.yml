name: Verify 0x002C5660 original guest pointer DWORD slots
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_002c/0x002c5660.c'
      - 'scripts/verify_002c5660_guest_pointer_slots.py'
      - '.github/workflows/verified-002c5660-guest-pointer-slots.yml'
      - 'include/bf_ghidra_types.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify guest DWORD storage and isolated C11 syntax
        run: python3 scripts/verify_002c5660_guest_pointer_slots.py --root .
