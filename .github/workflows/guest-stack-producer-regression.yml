name: Guest-stack producer/callee regression (synthetic)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_guest_stack_pair_20261028.py'
      - 'scripts/test_verify_guest_stack_pair_20261028.py'
      - 'scripts/verify_002ac100_eight_byte_output.py'
      - 'src/main_unclassified/band_002a/0x002ac100.c'
      - '.github/workflows/guest-stack-producer-regression.yml'
  workflow_dispatch:
jobs:
  synthetic-checks-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate contracts without private XBE
        run: python3 scripts/test_verify_guest_stack_pair_20261028.py
      - name: Check 0x002AC100 shared output storage, host Clang C11
        run: |
          python3 scripts/verify_002ac100_eight_byte_output.py --root .
          clang -std=c11 -fsyntax-only -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast -Wno-return-type -Wno-deprecated-non-prototype -I include src/main_unclassified/band_002a/0x002ac100.c
