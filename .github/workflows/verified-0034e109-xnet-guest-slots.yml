name: Verified XNet guest byte slots
# Legacy C11-triggered workflow: manual only until C++ repairs are validated.
on:
  workflow_dispatch:
jobs:
  guest-byte-slots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Clang availability
        run: clang --version
      - name: Source-only guest-byte contract and C11 regression
        run: python3 scripts/verify_0034e109_guest_slots.py
