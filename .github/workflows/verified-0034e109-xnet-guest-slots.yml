name: Verified XNet guest byte slots
on:
  push:
    branches: [main]
    paths:
      - src/platform/network_xnet/0x0034e109.c
      - scripts/verify_0034e109_guest_slots.py
      - .github/workflows/verified-0034e109-xnet-guest-slots.yml
      - include/bf_ghidra_types.h
  workflow_dispatch:
jobs:
  guest-byte-slots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Clang availability
        run: clang --version
      - name: Source-only guest-byte contract and C11 regression
        run: python3 scripts/verify_0034e109_guest_slots.py
