        run: python3 scripts/verify_cpp_20261102_four_source_matched.py --root .
      - name: Verify six source-matched C++17 declarations (Xbox ABI unverified)
        run: python3 scripts/verify_cpp_20261102_six_source_matched.py --root .
      - name: Verify five source-only C++17 declarations (Xbox ABI unverified)
        run: |
          python3 tests/test_cpp_20261102_five_source_only.py
          python3 scripts/verify_cpp_20261102_five_source_only.py --root .
      - name: Verify five new retail E8 source-only declarations (Xbox ABI unverified)
        run: python3 tests/test_cpp_20261102_five_source_e8.py
