name: Full C++17 source draft syntax inventory (not a native game build)
concurrency:
  group: full-cpp17-audit-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'scripts/**'
      - 'metadata/**'
      - 'docs/audits/**'
      - 'docs/evidence/002b3cc0_add_operation*.md'
      - 'docs/evidence/002b3e60_multiply_add_operation.md'
      - 'docs/evidence/002b8d10_multiply_add_operation.md'
      - 'docs/evidence/scalar_sse_conversion*.md'
      - 'docs/evidence/002b6640_mixed_operation.md'
      - 'docs/evidence/rational_logarithm_003174c5.md'
      - 'docs/evidence/timestamp_caller_storage_20261105.md'
      - 'tests/**'
      - 'viewer/**'
      - 'tools/source_layout.py'
      - 'tools/check_cpp_only_policy.py'
      - 'tools/sweep_cpp_compat.py'
      - 'tools/classify_cpp_failures.py'
      - 'tools/triage_cpp_undeclared_calls.py'
      - 'tools/test_triage_cpp_undeclared_calls.py'
      - 'tools/test_cpp_memory_helper_syntax.py'
      - 'tools/identify_cpp_verified_call_edges.py'
      - 'tools/test_identify_cpp_verified_call_edges.py'
      - 'tools/test_cpp_virtual_bridge_syntax.py'
      - 'include/bf_00155840_concrete_virtual.h'
      - 'include/bf_0011c810_concrete_virtual.h'
      - 'include/bf_0011c810_virtual_call_link.h'
      - 'include/bf_00155840_virtual_621c0.h'
      - 'metadata/x86_verified_call_edges.csv'
      - 'tools/test_classify_cpp_failures.py'
      - 'tools/test_sweep_cpp_compat.py'
      - 'include/bf_ghidra_types.h'
      - 'tools/test_cpp_ghidra_concat.py'
      - 'tools/test_cpp_allocator_guest32.py'
      - 'tools/test_cpp_00058d40_guest_handoff.py'
      - 'include/bf_00058d40_guest_handoff.h'
      - 'include/bf_002ea01d_allocator_guest32.h'
      - 'tools/verify_cpp_hotspot_xbe.py'
      - 'tools/verify_cpp_allocator_immediate_sites.py'
      - 'metadata/cpp_allocator_verified_call_sites.csv'
      - '.github/workflows/cpp-compatibility-audit.yml'
  workflow_dispatch:
    inputs:
      source_limit:
        description: "0 = all 13,694 drafts; otherwise sample first N"
        type: choice
        options: ["100", "0"]
        default: "100"
permissions:
  contents: write
jobs:
  cpp-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 40 adjacent original instruction windows and 21 focused handoffs (no private XBE)
        run: python3 tests/test_cpp_20261102_40_adjacent_windows.py
      - name: Verify 26 retail callee entry windows and 26 mutation controls (no private XBE)
        run: python3 tests/test_cpp_20261102_26_callee_prologues.py
      - name: Validate 40 retail-XBE direct-call manifest negative controls (no private XBE)
        run: python3 tests/test_cpp_20261102_40_xbe_edges.py
      - name: Verify 40 original caller/callee body provenance (no private XBE)
        run: python3 tests/test_cpp_20261102_40_body_provenance.py
      - name: Verify five DWORD primitive repairs and native instruction oracle
        run: python3 tools/verify_cpp_dword_operations.py
      - name: Verify superseded guest32 historical literal ledgers and live source pins
        run: python3 tools/test_cpp_20261107_superseded_literal_ledger.py
      - name: Verify two real color-helper object links and missing-definition controls
        run: python3 tools/check_cpp_20261112_color_object_links.py
      - name: Link and check guest D3D command writers
        run: python3 tools/check_cpp_d3d_guest_command_writers.py
      - name: Link and check three D3D texture and color command writers
        run: python3 tools/check_cpp_d3d_guest_texture_writers.py
      - name: Link and exercise four guest DWORD debug register models
        run: python3 tools/check_cpp_d3d_debug_register_models.py
      - name: Link two guest XNET record models
        run: python3 tools/check_cpp_guest32_xnet_record_models.py
      - name: Verify three audio and XNET guest memory traces
        run: python3 tools/check_cpp_guest32_audio_xnet_three_leaves.py
      - name: Check four Bink guest table expansion models
        run: python3 tools/test_cpp_bink32a_guest_models.py
      - name: Check four Bink guest WORD pixel loops
        run: python3 tools/test_cpp_bink_word_guest_models.py
      - name: Check Bink guest dispatch stores and stack operand
        run: python3 tools/check_cpp_bink_dispatch_0035feb0.py
      - name: Check guest table write order and CMP flags
        run: python3 tools/test_cpp_0030dbb0_guest_model.py
      - name: Link guest list and record-copy models with explicit direction and widths
        run: python3 tools/check_cpp_guest32_list_and_copy.py
      - name: Compile link and exercise three guest DWORD initializer models
        run: python3 tools/check_cpp_guest_record_initializers.py
      - name: Verify 209 further partial DWORD operand repairs
        run: python3 tools/verify_cpp_remaining_literal_repairs.py
      - name: Verify 20 original-XBE-gated byte-offset syntax repairs
        run: python3 tools/verify_cpp_byte_offsets_20.py --root .
      - name: Verify 250 bounded operand repairs with explicit residual errors
        run: python3 tools/verify_cpp_literal_declaration_batch.py
      - name: Verify 100 original Xbox guest address literal repairs
        run: python3 tools/verify_cpp_guest_address_literals.py --root .
      - name: Verify two exact source declarations (hidden register and return mismatches remain)
        run: python3 tools/test_cpp_20261105_two_source_declarations.py
      - name: Verify seven exact source declarations (hidden register and return mismatches remain)
        run: python3 tools/test_cpp_20261105_seven_source_declarations.py
      - name: Verify two WORD-limit caller source declarations
        run: python3 tools/test_cpp_20261105_word_source_declarations.py
      - name: Verify two source declarations with unresolved hidden register inputs
        run: python3 tools/test_cpp_20261105_register_source_declarations.py
      - name: Verify two bounded guest literals and exact source declarations (ABI unverified)
        run: python3 tools/test_cpp_20261105_literal_declaration_pair.py
      - name: Verify two bounded callback DWORD operands (not native object or ABI recovery)
        run: python3 tools/test_cpp_20261105_callback_dword_pair.py
      - name: Verify six bounded global DWORD operands (not ABI or mapping recovery)
        run: python3 tools/test_cpp_20261105_global_dword_six.py
      - name: Verify two 00023a80 DWORD operands (existing x87 mismatch remains)
        run: python3 tools/test_cpp_20261105_00023a80_literal_pair.py
      - name: Verify two WORD limit operands (no global mapping or ABI recovery)
        run: python3 tools/test_cpp_20261105_word_limit_widths.py
      - name: Verify two WORD counter operands (quarantined flows and ABI remain unresolved)
        run: python3 tools/test_cpp_20261105_counter_word_widths.py
      - name: Verify two timestamp caller declarations and local storage (not caller ABI)
        run: python3 tools/test_cpp_timestamp_caller_storage.py --sanitizers
      - name: Verify native unsynchronized timestamp transport (not Xbox clock or ABI)
        run: python3 tools/test_cpp_timestamp_leaves.py
      - name: Verify exact-rational logarithm foundation (not game implementation)
        run: |
          python3 -B tools/test_rational_logarithm_003174c5_gate.py
          python3 -B tools/verify_rational_logarithm_003174c5.py --root .
      - name: Verify masked signed32 scalar SSE conversion models (not game implementation)
        run: python3 tools/test_cpp_scalar_sse_conversions.py --compiler g++ --sanitize
      - name: Verify 27 original-address source declaration repairs
        run: python3 tools/verify_cpp_direct_declaration_batch.py --root .
      - name: Verify source-matched D3D C++17 declaration (ABI unverified)
        run: python3 scripts/verify_cpp_d3d_003747d7.py --root .
      - name: Verify source-matched 002E3500 C++17 declaration
        run: python3 scripts/verify_cpp_20261102_002e3500.py --root .
