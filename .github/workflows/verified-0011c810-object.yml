name: Verify 0x0011C810 original object argument
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_0011/0x0011c810.c'
      - 'scripts/verify_0011c810_original_object.py'
      - '.github/workflows/verified-0011c810-object.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-object-alias:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check original object-argument source invariants (no original Xbox binary)
        run: python3 scripts/verify_0011c810_original_object.py --root .
