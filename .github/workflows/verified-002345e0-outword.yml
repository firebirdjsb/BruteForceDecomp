name: Verify 0x002345e0 guest second-word out-slot
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_0023/0x002345e0.c'
      - 'scripts/verify_002345e0_guest_second_outword.py'
      - '.github/workflows/verified-002345e0-outword.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check XBE-backed source storage contract and focused Clang C11
        run: python3 scripts/verify_002345e0_guest_second_outword.py --root .
      - name: Evidence boundary
        run: echo "Original XBE checked locally, not committed; indirect ABI and native runtime unverified."
