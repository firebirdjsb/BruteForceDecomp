name: Verified 0x002B09D0 guest output release
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_002b/0x002b09d0.c'
      - 'scripts/verify_002b09d0_guest_output_release.py'
      - '.github/workflows/verified-002b09d0-release.yml'
      - 'include/bf_ghidra_types.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guest output lifetime and original vtable-offset regression
        run: python3 scripts/verify_002b09d0_guest_output_release.py --root .
