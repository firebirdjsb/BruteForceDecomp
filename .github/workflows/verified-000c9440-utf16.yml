name: Verified Xbox UTF-16 C11 storage and copy
# Legacy C11-triggered workflow: manual only until C++ repairs are validated.
on:
  workflow_dispatch:
jobs:
  utf16-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated C11 and guarded 16-bit copy at O0 and O2
        shell: bash
        run: |
          set -euo pipefail
          for source in src/main_unclassified/band_000c/0x000c9440.cpp src/main_unclassified/band_002e/0x002ea96c.cpp; do
            clang -std=c11 -fsyntax-only -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast -Wno-return-type -Wno-deprecated-non-prototype -Iinclude "$source"
          done
          for opt in 0 2; do
            clang -std=c11 -O"$opt" -Wall -Wextra -Werror -Wno-strict-prototypes -pedantic-errors -Iinclude tests/xbox_utf16_wcsncpy.c src/main_unclassified/band_002e/0x002ea96c.cpp -o /tmp/guest_utf16_copy
            /tmp/guest_utf16_copy
          done
          echo 'Source/Clang tests only; original XBE and native runtime not verified in public CI.'
