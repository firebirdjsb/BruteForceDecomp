name: Verify 0x0033DFD1 guest time record
on:
  push:
    branches: [main]
    paths:
      - 'src/platform/online_xonline/0x0033dfd1.c'
      - 'scripts/verify_0033dfd1_guest_time.py'
      - '.github/workflows/verified-0033dfd1-guest-time.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-word-layout:
    name: Source invariants, negative controls, isolated Clang C11
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify original 16-bit record writes (source-only; no XBE in CI)
        run: python3 scripts/verify_0033dfd1_guest_time.py --root .
