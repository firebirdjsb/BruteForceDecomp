name: Verified 0x000718F0 x87 scalar lifetimes
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_0007/0x000718f0.c'
      - 'scripts/verify_000718f0_x87_scalar_lifetimes.py'
      - '.github/workflows/verified-000718f0-x87-scalars.yml'
      - 'include/bf_ghidra_types.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x87-scalar-lifetimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert guest F32 bits and original scalar/SIMD output lifetimes
        run: python3 scripts/verify_000718f0_x87_scalar_lifetimes.py --root .
