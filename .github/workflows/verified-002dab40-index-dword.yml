name: Verified 0x002DAB40 guest index-table DWORD
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_002d/0x002dab40.c'
      - 'scripts/verify_002dab40_guest_index_pointer.py'
      - '.github/workflows/verified-002dab40-index-dword.yml'
      - 'include/bf_ghidra_types.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original guest table address and isolated C11
        run: python3 scripts/verify_002dab40_guest_index_pointer.py --root .
