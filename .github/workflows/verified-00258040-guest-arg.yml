name: Verify 0x00258040 third guest DWORD address
on:
  push:
    branches: [main]
    paths:
      - 'src/main_unclassified/band_0025/0x00258040.c'
      - 'scripts/verify_00258040_guest_third_argument.py'
      - '.github/workflows/verified-00258040-guest-arg.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify two shared original guest-argument addresses and C11
        run: python3 scripts/verify_00258040_guest_third_argument.py --root .
