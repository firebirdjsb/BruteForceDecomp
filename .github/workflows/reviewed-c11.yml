name: Reviewed C11 ABI models

# Legacy C11-triggered workflow: manual only until C++ repairs are validated.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  reviewed-c11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host and Windows-x86 C11 syntax
        shell: bash
        run: |
          set -euo pipefail
          sources=(src/reviewed_by_assembly/bf_format_to_counted_buffer/0x002eb322.cpp src/reviewed_by_assembly/bf_format_to_global_crt_stream/0x002ebce0.cpp src/reviewed_by_assembly/bf_format_varargs_to_counted_buffer/0x002eaa19.cpp src/reviewed_by_assembly/bf_format_with_existing_buffer_length/0x002eaefa.cpp src/reviewed_by_assembly/bf_format_then_output_debug_text/0x002ff500.cpp src/reviewed_by_assembly/bf_format_with_capacity_check/0x0033df31.cpp src/reviewed_by_assembly/bf_format_then_debug_print/0x0037a3e0.cpp src/reviewed_by_assembly/bf_forward_tagged_four_byte_word/0x00349413.cpp src/reviewed_by_assembly/bf_construct_tagged_byte_record/0x00349366.cpp src/reviewed_by_assembly/bf_initialize_observed_record_header/0x00347fe3.cpp)
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude -fsyntax-only "${sources[@]}"
          clang -target i386-pc-windows-msvc -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude -fsyntax-only "${sources[@]}"
      - name: Three-function formatting integration with mocked dependencies
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude -fsanitize=address,undefined             src/reviewed_by_assembly/bf_format_to_counted_buffer/0x002eb322.cpp src/reviewed_by_assembly/bf_format_with_capacity_check/0x0033df31.cpp src/reviewed_by_assembly/bf_format_then_debug_print/0x0037a3e0.cpp tests/test_format_callee.c             -o /tmp/test_format_callee
          /tmp/test_format_callee
      - name: Additional independently mocked wrapper checks
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude             src/reviewed_by_assembly/bf_format_then_output_debug_text/0x002ff500.cpp tests/test_double_format.c -o /tmp/test_double_format
          /tmp/test_double_format
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude             src/reviewed_by_assembly/bf_forward_tagged_four_byte_word/0x00349413.cpp tests/test_xnet_context.c -o /tmp/test_xnet_context
          /tmp/test_xnet_context
      - name: CRT stream format stack wrapper with mocked backend
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude \
            src/reviewed_by_assembly/bf_format_to_global_crt_stream/0x002ebce0.cpp tests/test_global_stream_format.c -o /tmp/test_global_stream_format
          /tmp/test_global_stream_format
      - name: Two additional CRT variadic stack wrappers
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude -fsanitize=address,undefined \
            src/reviewed_by_assembly/bf_format_varargs_to_counted_buffer/0x002eaa19.cpp src/reviewed_by_assembly/bf_format_with_existing_buffer_length/0x002eaefa.cpp tests/test_crt_variadic_stack.c \
            -o /tmp/test_crt_variadic_stack
          /tmp/test_crt_variadic_stack
      - name: XNET callee plus wrapper host dependency mocks
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude -fsanitize=address,undefined \
            src/reviewed_by_assembly/bf_construct_tagged_byte_record/0x00349366.cpp src/reviewed_by_assembly/bf_forward_tagged_four_byte_word/0x00349413.cpp tests/test_xnet_record.c \
            -o /tmp/test_xnet_record
          /tmp/test_xnet_record
      - name: Register and caller-stack preparation analysis models
        shell: bash
        run: |
          set -euo pipefail
          clang -target i386-pc-windows-msvc -std=c11 -pedantic-errors -Wall -Wextra -Werror -Ianalysis -fsyntax-only analysis/bf_6a610_call_preparation.c
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror -Ianalysis analysis/bf_6a610_call_preparation.c tests/test_6a610_call_preparation.c -o /tmp/test_6a610_prep
          /tmp/test_6a610_prep
      - name: ECX record header writer — isolated strict C11 and host mock
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude \
            src/reviewed_by_assembly/bf_initialize_observed_record_header/0x00347fe3.cpp tests/test_xnet_record_header.c -o /tmp/test_xnet_header
          /tmp/test_xnet_header
          clang -target i386-pc-windows-msvc -std=c11 -pedantic-errors \
            -Wall -Wextra -Werror -Iinclude -fsyntax-only src/reviewed_by_assembly/bf_initialize_observed_record_header/0x00347fe3.cpp
      - name: Check 32-bit x86 stack cleanup opcode in tagged record wrapper
        shell: bash
        run: |
          set -euo pipefail
          clang -target i386-pc-windows-msvc -O1 -Iinclude -S -masm=intel src/reviewed_by_assembly/bf_forward_tagged_four_byte_word/0x00349413.cpp -o /tmp/xnet-context.s
          grep -Eiq 'ret[[:space:]]+8' /tmp/xnet-context.s
          clang -target i386-pc-windows-msvc -O1 -Iinclude -S -masm=intel src/reviewed_by_assembly/bf_construct_tagged_byte_record/0x00349366.cpp -o /tmp/xnet-record.s
          grep -Eiq 'ret[[:space:]]+24' /tmp/xnet-record.s

# All tests above use mocks / isolated compilation.
# Success does NOT imply original Xbox ABI, game runtime, or byte equivalence.
