name: Apply XBE-verified SEH immediate C11 repairs
on:
  push:
    branches: [main]
    paths:
      - 'tools/repair_verified_seh_immediates.py'
      - 'metadata/verified_seh_immediates.csv'
      - '.github/workflows/verified-seh-immediates.yml'

permissions:
  contents: write

concurrency:
  group: verified-seh-immediates-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Validate exact source identities and apply reviewed guest VA corrections
        run: |
          python3 tools/repair_verified_seh_immediates.py --apply
          python3 tools/repair_verified_seh_immediates.py --verify
          git diff --check
      - name: Commit C11 source repairs to main only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main_unclassified
          if git diff --cached --quiet; then
            echo 'All reviewed source repairs already present.'
          else
            git commit -m 'C11: preserve 407 XBE SEH handler immediates as guest VAs'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
