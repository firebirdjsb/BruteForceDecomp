name: Verified node-copy entry DWORDs (source-only C11)
# Legacy C11-triggered workflow: manual only until C++ repairs are validated.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-invariants-and-c11:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check six caller guest-stack words and callee return (source-only)
        run: python3 scripts/verify_000ff730_guest_word_callers.py --root .
      - name: Explain evidence boundary
        run: echo 'Retail XBE SHA/body hashes and instruction windows were verified locally. No original binary is distributed; this source-only gate is not guest ABI, cross-function link, or native runtime verification.'
