name: Verified 0x00027540 SSE float3 and scalar RSQRTSS
# Legacy C11-triggered workflow: manual only until C++ repairs are validated.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-sse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original 3 F32 lanes and isolated Clang C11
        run: python3 scripts/verify_00027540_sse_float3.py --root .
