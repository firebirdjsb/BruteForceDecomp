name: Numeric and EAX-stack C11 review

# Legacy C11-triggered workflow: manual only until C++ repairs are validated.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register and stack cleanup C11 model
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude \
            src/reviewed_by_assembly/bf_advance_counter_then_forward_word/0x000563b0.cpp tests/test_eax_stack_dispatch.c -o /tmp/test_eax_dispatch
          /tmp/test_eax_dispatch
          clang -target i386-pc-windows-msvc -std=c11 -O1 -Iinclude -masm=intel \
            -S src/reviewed_by_assembly/bf_advance_counter_then_forward_word/0x000563b0.cpp -o /tmp/eax_dispatch.s
          grep -Eiq 'ret[[:space:]]+4' /tmp/eax_dispatch.s
          clang -std=c11 -Iinclude -c src/reviewed_by_assembly/bf_advance_counter_then_forward_word/0x000563b0.cpp -o /tmp/eax_dispatch.o
          nm /tmp/eax_dispatch.o | grep -q 'FUN_000563b0'
      - name: Actual 27-byte scalar RSQRTSS x86 function
        shell: bash
        run: |
          set -euo pipefail
          clang -msse -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude \
            src/reviewed_by_assembly/bf_approximate_reciprocal_sqrt_scalar/0x002b6490.cpp tests/test_scalar_rsqrtss.c -lm -o /tmp/test_scalar_rsqrt
          /tmp/test_scalar_rsqrt
          clang -target i386-pc-windows-msvc -msse -O1 -Iinclude -S \
            src/reviewed_by_assembly/bf_approximate_reciprocal_sqrt_scalar/0x002b6490.cpp -o /tmp/rsqrtss.s
          grep -Eiq 'rsqrtss' /tmp/rsqrtss.s
      - name: x87 pointer-merge fixes — lenient syntax only
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -fsyntax-only -Iinclude \
            -Wno-implicit-function-declaration -Wno-int-conversion \
            -Wno-incompatible-pointer-types -Wno-pointer-to-int-cast \
            -Wno-int-to-pointer-cast -Wno-return-type \
            -Wno-deprecated-non-prototype \
            src/main_unclassified/band_0002/0x0002ac80.cpp src/main_unclassified/band_0004/0x000481c0.cpp
      - name: rsqrtss scalar lane — lenient syntax only
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -msse -fsyntax-only -Iinclude \
            -Wno-implicit-function-declaration -Wno-int-conversion \
            -Wno-incompatible-pointer-types -Wno-pointer-to-int-cast \
            -Wno-int-to-pointer-cast -Wno-return-type \
            -Wno-deprecated-non-prototype -Wno-literal-range \
            src/main_unclassified/band_0001/0x0001d0c0.cpp src/main_unclassified/band_0002/0x000213e0.cpp src/main_unclassified/band_0002/0x00024c00.cpp \
            src/main_unclassified/band_0002/0x00026060.cpp src/main_unclassified/band_0002/0x0002bf60.cpp src/main_unclassified/band_0002/0x00025870.cpp

# All checks above validate local C syntax / mocked argument flow only.
# Original game ABI, x87 precision, linked behavior, and binary identity remain unverified.
