name: Apply verified guest immediate C11 repairs
# Legacy C11-triggered workflow: manual only until C++ repairs are validated.
on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: verified-guest-immediates-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Apply exact-source-hash-gated reviewed C11 replacements
        run: |
          python3 tools/repair_verified_guest_immediates.py --apply --verify
          python3 tools/repair_verified_guest_immediates.py --verify
          git diff --check
      - name: Commit verified changes to main only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/
          if git diff --cached --quiet; then
            echo 'All 49 reviewed source repairs already present.'
          else
            git commit -m 'C11: preserve 49 original XBE guest immediate words'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
